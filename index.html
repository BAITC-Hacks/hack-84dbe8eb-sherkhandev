<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HackAlem AI — демо чат-консультанта для магазина электротоваров" />
    <title>HackAlem AI — магазин электротоваров</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ЭЛЕКТРОТОВАРЫ · КОНСУЛЬТАНТ</p>
          <h1>HackAlem <span>AI</span></h1>
        </div>
        <div class="demo-note">Демо: тестовые товары, ответы по правилам</div>
      </header>

      <main class="workspace">
        <section class="panel chat-panel" aria-labelledby="chat-title">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Помощник по каталогу</p>
              <h2 id="chat-title">Чат-консультант</h2>
            </div>
            <span class="status"><i></i> онлайн</span>
          </div>

          <div id="messages" class="messages" aria-live="polite"></div>

          <div class="examples" aria-label="Примеры запросов">
            <span>Попробуйте:</span>
            <button type="button" class="example-button" data-query="EL-101">Найти EL-101</button>
            <button type="button" class="example-button" data-query="кабель NYM">Кабель NYM</button>
            <button type="button" class="example-button" data-query="доставка">Условия доставки</button>
          </div>

          <form id="chat-form" class="chat-form">
            <label class="sr-only" for="query">Ваш вопрос</label>
            <input id="query" name="query" autocomplete="off" placeholder="Например: нужен EL-106 или условия оплаты" />
            <button class="send-button" type="submit" aria-label="Отправить сообщение">Отправить <span>↗</span></button>
          </form>
        </section>

        <aside id="cart" class="panel cart-panel" aria-labelledby="cart-title">
          <div class="panel-heading cart-heading">
            <div>
              <p class="section-kicker">Ваш заказ</p>
              <h2 id="cart-title">Корзина <span id="cart-count" class="count-badge">0</span></h2>
            </div>
            <span class="cart-icon" aria-hidden="true">▱</span>
          </div>
          <div id="cart-items" class="cart-items"></div>
          <div class="cart-footer">
            <div class="total-row"><span>Итого</span><strong id="cart-total">0 ₸</strong></div>
            <p class="cart-hint">Демо-корзина сохраняется в этом браузере.</p>
          </div>
        </aside>
      </main>

      <footer class="footer-note">Цены и наличие показаны для демонстрации интерфейса.</footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
